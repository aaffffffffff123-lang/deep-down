<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>침잠하기</title>
<style>
  :root{
    --cream:#fff6e4; --cream2:#ffe9c2; --brown:#5a3d1e; --brown2:#8a6238; --line:#e3c48f;
    --shadow:0 6px 0 rgba(90,61,30,.18), 0 10px 24px rgba(90,61,30,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#bfe6ff;
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    color:var(--brown);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;}
  .ui{position:fixed;inset:0;pointer-events:none;}
  .ui > *{pointer-events:auto;}

  #pouch{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    display:flex;gap:8px;padding:8px 10px;background:var(--cream);border-radius:22px;box-shadow:var(--shadow);
    border:3px solid var(--line);opacity:0;transition:opacity .3s, transform .15s;pointer-events:none;}
  #pouch.show{opacity:1;}
  #pouch.shake{animation:shake .35s;}
  @keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 7px))}50%{transform:translateX(calc(-50% + 7px))}75%{transform:translateX(calc(-50% - 4px))}}
  .slot{width:46px;height:46px;border-radius:50%;background:var(--cream2);border:2px dashed var(--line);
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .slot img{width:42px;height:42px;display:block;}
  .slot.filled{border-style:solid;background:#fff;}
  .slot.pop{animation:pop .35s;}
  @keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  @media (max-width:420px){.slot{width:40px;height:40px}.slot img{width:36px;height:36px}}

  #toast{position:fixed;top:calc(78px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-8px) scale(.96);
    display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;width:max-content;max-width:min(92vw,470px);
    background:var(--cream);border:3px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
    opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
  #toast img{width:58px;height:58px;flex:none;border-radius:14px;background:#fff;border:2px solid var(--cream2);}
  #toast .tt{display:flex;flex-direction:column;gap:4px;min-width:0;}
  #toast .tn{font-size:17px;font-weight:800;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  #toast .tr{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--cream2);border:2px solid var(--line);color:var(--brown2);font-weight:700;}
  #toast .tr.r2{background:#dff1ff;border-color:#9fd0ff;color:#2d5f8a}
  #toast .tr.r3{background:#ffe3ef;border-color:#ffa9c9;color:#a62b5f}
  #toast .tl{font-size:15px;color:var(--brown);line-height:1.38;}

  #hint{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:9px 16px;border-radius:18px;
    background:rgba(255,246,228,.94);border:2px solid var(--line);color:var(--brown);font-size:14px;font-weight:700;opacity:0;
    transition:opacity .4s;pointer-events:none;text-align:center;width:max-content;max-width:88vw;line-height:1.45;}
  #hint.show{opacity:1;}

  #cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
    background:rgba(255,255,255,.92);box-shadow:0 0 0 2px rgba(60,40,20,.32);display:none;pointer-events:none;}
  #cross.show{display:block;}

  #act{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);
    min-width:180px;padding:16px 30px;border-radius:40px;background:var(--cream);color:var(--brown);
    font-size:20px;font-weight:800;letter-spacing:-.01em;box-shadow:var(--shadow);border:3px solid var(--line);
    display:none;cursor:pointer;font-family:inherit;}
  #act.show{display:block;}
  #act:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 rgba(90,61,30,.18);}
  #act .k{font-size:13px;opacity:.6;margin-left:6px;font-weight:700;}
  #act.corner{left:auto;transform:none;right:calc(14px + env(safe-area-inset-right));top:calc(84px + env(safe-area-inset-top));bottom:auto;
    min-width:0;padding:11px 18px;font-size:16px;}
  #act.corner:active{transform:translateY(3px);}
  @media (min-aspect-ratio: 1/1){
    #hint{bottom:calc(20px + env(safe-area-inset-bottom));}
    #act{left:auto;right:calc(28px + env(safe-area-inset-right));bottom:calc(28px + env(safe-area-inset-bottom));transform:none;}
    #act:active{transform:translateY(3px);}
    #act.corner{top:calc(14px + env(safe-area-inset-top));}
  }

  #dig{position:fixed;right:calc(20px + env(safe-area-inset-right));bottom:calc(34px + env(safe-area-inset-bottom));
    width:104px;height:104px;border-radius:50%;border:4px solid var(--line);background:var(--cream);box-shadow:var(--shadow);
    display:none;font-size:20px;font-weight:800;color:var(--brown);font-family:inherit;touch-action:none;}
  #dig.show{display:block;}
  #dig.on{transform:translateY(3px) scale(.97);background:#ffe0a8;box-shadow:0 2px 0 rgba(90,61,30,.18);}

  #mm{position:fixed;left:calc(10px + env(safe-area-inset-left));top:50%;transform:translateY(-50%);
    width:40px;height:52vh;border-radius:14px;background:var(--cream);border:3px solid var(--line);
    box-shadow:var(--shadow);display:none;overflow:hidden;pointer-events:none;}
  #mm.show{display:block;}
  #mm.wide{width:min(48vw,270px);height:min(46vh,270px);left:auto;right:12px;top:auto;bottom:calc(24px + env(safe-area-inset-bottom));transform:none;}
  #mmc{width:100%;height:100%;display:block;}

  #joy{position:fixed;width:124px;height:124px;border-radius:50%;background:rgba(255,246,228,.40);
    border:3px solid rgba(255,246,228,.85);display:none;transform:translate(-50%,-50%);pointer-events:none;}
  #joyk{position:absolute;left:50%;top:50%;width:54px;height:54px;border-radius:50%;background:var(--cream);
    border:3px solid var(--line);transform:translate(-50%,-50%);box-shadow:0 4px 10px rgba(90,61,30,.25);}

  .card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(#cfeeff,#f7f1dc 70%);gap:22px;transition:opacity .6s;}
  .card h1{font-size:min(16vw,84px);margin:0;font-weight:800;letter-spacing:-.03em;color:var(--brown);
    text-shadow:0 6px 0 rgba(90,61,30,.12);}
  .card .btn{padding:16px 44px;border:3px solid var(--line);border-radius:40px;background:var(--cream);
    color:var(--brown);font-size:22px;font-weight:800;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;}
  .card .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(90,61,30,.18);}
  .card .hint{font-size:14px;color:var(--brown2);opacity:.9;text-align:center;line-height:1.7;}
  .card.hide{opacity:0;pointer-events:none;}
  #end{opacity:0;pointer-events:none;background:linear-gradient(#e9f3fb,#f7f1dc 70%);}
  #end.show{opacity:1;pointer-events:auto;}
  #end .btn{opacity:0;transition:opacity .8s;}
  #end.show .btn{opacity:1;transition-delay:1.6s;}

  #fade{position:fixed;inset:0;background:#2b1b0d;opacity:0;pointer-events:none;transition:opacity .35s;}

  #insp{position:fixed;inset:0;background:rgba(247,241,220,.94);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;padding:20px;}
  #insp.show{display:flex;}
  #inspc{width:min(78vw,420px);height:min(78vw,420px);border-radius:28px;background:#fff;border:3px solid var(--line);
    box-shadow:var(--shadow);touch-action:none;}
  #inspName{font-size:26px;font-weight:800;margin-top:6px;}
  #inspRare{font-size:14px;padding:4px 12px;border-radius:14px;background:var(--cream2);border:2px solid var(--line);color:var(--brown2);font-weight:700;}
  #inspRare.r2{background:#dff1ff;border-color:#9fd0ff;color:#2d5f8a}
  #inspRare.r3{background:#ffe3ef;border-color:#ffa9c9;color:#a62b5f}
  #inspDesc{font-size:17px;color:var(--brown);text-align:center;max-width:420px;line-height:1.5;}
  #inspClose{margin-top:8px;padding:12px 32px;border:3px solid var(--line);border-radius:30px;background:var(--cream);
    color:var(--brown);font-size:17px;font-weight:800;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui">
  <div id="pouch"></div>
  <div id="toast"><img alt=""><div class="tt"><div class="tn"><span class="nm"></span><span class="tr"></span></div><div class="tl"></div></div></div>
  <div id="hint"></div>
  <div id="cross"></div>
  <div id="mm"><canvas id="mmc"></canvas></div>
  <div id="joy"><div id="joyk"></div></div>
  <button id="act"></button>
  <button id="dig">파기</button>
  <div id="fade"></div>
  <div id="insp">
    <canvas id="inspc"></canvas>
    <div id="inspName"></div>
    <div id="inspRare"></div>
    <div id="inspDesc"></div>
    <button id="inspClose">닫기</button>
  </div>
  <div id="title" class="card">
    <h1>침잠하기</h1>
    <button id="startBtn" class="btn">시작</button>
    <div class="hint">PC: WASD로 이동 · 마우스로 둘러보기 · 클릭으로 파기<br>폰: 화면 왼쪽으로 이동 · 오른쪽으로 둘러보기</div>
  </div>
  <div id="end" class="card">
    <h1>침잠하기</h1>
    <button id="againBtn" class="btn">처음부터</button>
  </div>
</div>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- utils ----------
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
const smoothstep=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
let seed=12345;
const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
const rr=(a,b)=>a+rnd()*(b-a);
const pick=arr=>arr[Math.floor(rnd()*arr.length)];
const mrand=(a,b)=>a+Math.random()*(b-a);
const shuffle=arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const DEG=Math.PI/180;
const $=id=>document.getElementById(id);
const angDiff=(a,b)=>Math.atan2(Math.sin(b-a),Math.cos(b-a));

// value noise
function hash2(x,z){let h=(x*374761393+z*668265263)|0;h=(h^(h>>>13))*1274126177|0;h^=h>>>16;return (h>>>0)/4294967296;}
function hash3(x,y,z){let h=(x*374761393+y*1442695041+z*668265263)|0;h=(h^(h>>>13))*1274126177|0;h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise2(x,z){const xi=Math.floor(x),zi=Math.floor(z);const xf=x-xi,zf=z-zi;const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  const a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1);return lerp(lerp(a,b,u),lerp(c,d,u),v)*2-1;}
function vnoise3(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);const xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const c000=hash3(xi,yi,zi),c100=hash3(xi+1,yi,zi),c010=hash3(xi,yi+1,zi),c110=hash3(xi+1,yi+1,zi);
  const c001=hash3(xi,yi,zi+1),c101=hash3(xi+1,yi,zi+1),c011=hash3(xi,yi+1,zi+1),c111=hash3(xi+1,yi+1,zi+1);
  return lerp(lerp(lerp(c000,c100,u),lerp(c010,c110,u),v),lerp(lerp(c001,c101,u),lerp(c011,c111,u),v),w)*2-1;}
function fbm2(x,z){return vnoise2(x,z)*0.6+vnoise2(x*2.1+7.3,z*2.1-3.1)*0.28+vnoise2(x*4.3-2.2,z*4.3+5.5)*0.12;}

// ---------- renderer ----------
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
renderer.autoClear=false;

const pmrem=new THREE.PMREMGenerator(renderer);
const ENVTEX=pmrem.fromScene(new RoomEnvironment(),0.04).texture;

const camera=new THREE.PerspectiveCamera(70,1,0.04,1400);
camera.rotation.order='YXZ';
const viewCam=new THREE.PerspectiveCamera(55,1,0.01,10);
function fovFor(a){return a>=1.5?64:a>=1.1?68:a>=0.8?76:86;}
function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=fovFor(camera.aspect);camera.updateProjectionMatrix();
  viewCam.aspect=w/h;viewCam.fov=camera.aspect<1?64:54;viewCam.updateProjectionMatrix();
  if(window.View&&window.View.layout&&window.View.R)window.View.layout();
}
window.addEventListener('resize',resize);resize();

// ---------- materials ----------
const matCache={};
function mat(color,opt={}){
  const key=color+'|'+JSON.stringify(opt);
  if(matCache[key])return matCache[key];
  const o=Object.assign({},opt);const env=o.env;delete o.env;
  const m=new THREE.MeshStandardMaterial(Object.assign({color,roughness:.85,metalness:0},o));
  if(env){m.envMap=ENVTEX;m.envMapIntensity=env===true?1:env;}
  matCache[key]=m;return m;
}
function shade(m){m.castShadow=true;m.receiveShadow=true;return m;}
function box(w,h,d,color,opt){return shade(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,opt)));}
function rbox(w,h,d,r,color,opt){return shade(new THREE.Mesh(new RoundedBoxGeometry(w,h,d,3,r),mat(color,opt)));}
function sph(r,color,opt,ws=14,hs=10){return shade(new THREE.Mesh(new THREE.SphereGeometry(r,ws,hs),mat(color,opt)));}
function cyl(rt,rb,h,color,opt,seg=14){return shade(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(color,opt)));}
function cone(r,h,color,opt,seg=14){return shade(new THREE.Mesh(new THREE.ConeGeometry(r,h,seg),mat(color,opt)));}
function dispose(obj){obj.traverse(o=>{if(o.geometry)o.geometry.dispose();});}
function canvasTex(w,h,draw,repeat){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');draw(ctx,w,h);
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;
  if(repeat)t.repeat.set(repeat[0],repeat[1]);t.anisotropy=4;return t;
}
function noShadow(o){o.traverse(m=>{if(m.isMesh){m.castShadow=false;}});return o;}
// ---------- draw-call batching ----------
function flipWinding(g){const a=g.attributes;for(const k of Object.keys(a)){const at=a[k],n=at.itemSize,arr=at.array;for(let i=0;i<at.count;i+=3){for(let j=0;j<n;j++){const t=arr[(i+1)*n+j];arr[(i+1)*n+j]=arr[(i+2)*n+j];arr[(i+2)*n+j]=t;}}at.needsUpdate=true;}}
function bakeGeo(o,m4,keepUV){
  let g=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();
  for(const k of Object.keys(g.attributes))if(k!=='position'&&k!=='normal'&&!(keepUV&&k==='uv'))g.deleteAttribute(k);
  g.morphAttributes={};g.clearGroups();
  if(!g.attributes.normal)g.computeVertexNormals();
  if(keepUV&&!g.attributes.uv)g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(g.attributes.position.count*2),2));
  g.applyMatrix4(m4);if(m4.determinant()<0)flipWinding(g);return g;
}
// merge static meshes under root by material (keeps materials); skip = Set of subtrees to leave alone
function batchMeshes(root,skip){
  root.updateMatrixWorld(true);
  const inv=new THREE.Matrix4().copy(root.matrixWorld).invert(),tmp=new THREE.Matrix4();
  const groups=new Map(),rm=[];
  const visit=o=>{
    if(skip&&skip.has(o))return;
    for(const c of o.children)visit(c);
    if(o===root||!o.isMesh||o.isInstancedMesh||o.children.length||Array.isArray(o.material)||o.material.transparent||!o.visible)return;
    const key=o.material.uuid+'|'+(+o.castShadow)+(+o.receiveShadow);
    let e=groups.get(key);if(!e){e={mat:o.material,cast:o.castShadow,recv:o.receiveShadow,geos:[],objs:[]};groups.set(key,e);}
    e.geos.push(bakeGeo(o,tmp.multiplyMatrices(inv,o.matrixWorld),true));e.objs.push(o);
  };
  visit(root);
  for(const e of groups.values()){
    if(e.objs.length<2){e.geos.forEach(g=>g.dispose());continue;}
    const mg=mergeGeometries(e.geos,false);e.geos.forEach(g=>g.dispose());if(!mg)continue;
    e.objs.forEach(o=>{o.parent.remove(o);o.geometry.dispose();});
    const m=new THREE.Mesh(mg,e.mat);m.castShadow=e.cast;m.receiveShadow=e.recv;root.add(m);
  }
  return root;
}
// merge a rigid group's direct mesh children into one vertex-coloured mesh (for small characters/props)
const VC_MAT=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.8});
function bakeVC(g){
  const geos=[],rm=[];let cast=false;
  for(const o of g.children){
    if(!o.isMesh||o.children.length||Array.isArray(o.material))continue;const m=o.material;
    if(m.emissive&&m.emissiveIntensity>0&&m.emissive.getHex()!==0)continue;
    if(m.envMap||m.map)continue;
    const col=m.transparent?o.userData.blend:m.color;if(!col)continue;
    o.updateMatrix();const ge=bakeGeo(o,o.matrix,false);
    const n=ge.attributes.position.count,ca=new Float32Array(n*3);for(let i=0;i<n;i++){ca[i*3]=col.r;ca[i*3+1]=col.g;ca[i*3+2]=col.b;}
    ge.setAttribute('color',new THREE.BufferAttribute(ca,3));geos.push(ge);rm.push(o);if(o.castShadow)cast=true;
  }
  if(geos.length<2){geos.forEach(x=>x.dispose());return null;}
  const mg=mergeGeometries(geos,false);geos.forEach(x=>x.dispose());if(!mg)return null;
  rm.forEach(o=>{g.remove(o);o.geometry.dispose();});
  const mesh=new THREE.Mesh(mg,VC_MAT);mesh.castShadow=cast;mesh.receiveShadow=true;g.add(mesh);return mesh;
}

// ---------- scenes ----------
function makeScene(hemiSky,hemiGround,hemiI,sunCol,sunI,shadow){
  const s=new THREE.Scene();
  const hemi=new THREE.HemisphereLight(hemiSky,hemiGround,hemiI);s.add(hemi);
  const sun=new THREE.DirectionalLight(sunCol,sunI);sun.position.set(8,16,7);
  sun.castShadow=!!shadow;
  if(shadow){
    sun.shadow.mapSize.set(2048,2048);
    sun.shadow.camera.near=1;sun.shadow.camera.far=120;
    sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-24;
    sun.shadow.bias=-0.0005;sun.shadow.normalBias=0.03;
  }
  s.add(sun);s.add(sun.target);
  const amb=new THREE.AmbientLight(0xffffff,0.16);s.add(amb);
  return {scene:s,hemi,sun,amb};
}
const SURF=makeScene(0xd6efff,0x6fae46,1.0,0xfff1d6,2.0,true);
const INNER=makeScene(0xeaf6ff,0x7a5634,1.05,0xfff3dc,0.75,false);
const HUT=makeScene(0xffe9c6,0x8a6238,0.95,0xfff0d8,1.0,true);
HUT.sun.position.set(3,8,5);
HUT.sun.shadow.camera.left=-5;HUT.sun.shadow.camera.right=5;HUT.sun.shadow.camera.top=5;HUT.sun.shadow.camera.bottom=-5;
const VIEW=makeScene(0xfff6ea,0x8a6a4a,1.15,0xfff2dd,1.3,false);
VIEW.sun.position.set(-1.5,3,2.5);

// ---------- game constants ----------
const POUCH=5;
const STRATA=[

  now(){return this.ctx?this.ctx.currentTime:0;},
  noise(dur,filterType,freq,q,gain,t0,dest,brown,pan){

  tone(freq,dur,type,gain,t0,dest,freqEnd,attack=0.005){

  playStep(step,t){

function setupFinds(){
  const finds=[];
  const bands=[[],[],[]];
  for(const id in ITEMS){const it=ITEMS[id];if(it.band!==undefined)bands[it.band].push(id);}
  // band 0
  const b0=shuffle(bands[0]),l0=shuffle(LINES[0]);
  b0.forEach((id,i)=>{ITEMS[id].d=l0[i%l0.length];});
  const b1=shuffle(bands[1]),l1=shuffle(LINES[1]);
  b1.forEach((id,i)=>{ITEMS[id].d=l1[i%l1.length];});
  const deepFixed=['cd','capsule'];
  const b2=shuffle(bands[2].filter(id=>!deepFixed.includes(id))),l2=shuffle(LINES[2]);
  b2.forEach((id,i)=>{ITEMS[id].d=l2[i%l2.length];});
  ITEMS.cd.d='이걸 알아서 뭐가 달라지는지는 모르겠다.';
  ITEMS.capsule.d='여기까지 와서도 똑같다.';
  const place=(ids,y0,y1)=>{const n=ids.length;ids.forEach((id,i)=>{
    const y=lerp(y0,y1,(i+0.5)/n)+mrand(-0.25,0.25);
    for(let tries=0;tries<40;tries++){const a=Math.random()*Math.PI*2;const r=mrand(0.25,2.1);const x=Math.cos(a)*r,z=Math.sin(a)*r;
      if(finds.every(f=>Math.hypot(f.x-x,f.y-y,f.z-z)>1.05)||tries===39){finds.push({id,x,y,z,rot:[Math.random()*6.28,Math.random()*6.28,Math.random()*6.28]});break;}}
  });};
  place(b0,-2.0,-13.3);place(b1,-14.7,-31.3);place(b2,-32.8,-38.8);
  const ac=Math.random()*6.28;finds.push({id:'cd',x:Math.cos(ac)*0.9,y:-39.6,z:Math.sin(ac)*0.9,rot:[0.2,1,0.1]});
  const ad=ac+2.4;finds.push({id:'capsule',x:Math.cos(ad)*0.6,y:-40.6,z:Math.sin(ad)*0.6,rot:[0.1,0.5,0.2]});
  return finds;
}
function makeItemMesh(id){const g=new THREE.Group();const m=ITEMS[id].mk();g.add(m);g.userData.itemId=id;return g;}
function fitObject(g,size){const bb=new THREE.Box3().setFromObject(g);const s=new THREE.Vector3();bb.getSize(s);const c=new THREE.Vector3();bb.getCenter(c);const k=size/Math.max(s.x,s.y,s.z);const w=new THREE.Group();g.scale.multiplyScalar(k);g.position.set(-c.x*k,-c.y*k,-c.z*k);w.add(g);return w;}

function swapEnv(obj,env){obj.traverse(o=>{if(o.isMesh){const arr=Array.isArray(o.material);const ms=arr?o.material:[o.material];
  const nm=ms.map(m=>{if(m.envMap===ENVTEX){const c=m.clone();c.envMap=env;return c;}return m;});o.material=arr?nm:nm[0];}});}
function renderIcons(){
  const size=96;const r=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  r.setSize(size,size);r.setPixelRatio(1);r.outputColorSpace=THREE.SRGBColorSpace;
  const pm=new THREE.PMREMGenerator(r);const env=pm.fromScene(new RoomEnvironment(),0.04).texture;
  const sc=new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff,0x887766,1.35));
  const d=new THREE.DirectionalLight(0xffffff,1.7);d.position.set(2,3,2);sc.add(d);
  const cam=new THREE.PerspectiveCamera(30,1,0.1,10);cam.position.set(0.5,0.85,1.05);cam.lookAt(0,0,0);
  for(const id in ITEMS){
    const g=makeItemMesh(id);swapEnv(g,env);
    const w=fitObject(g,0.56);sc.add(w);r.render(sc,cam);ITEMS[id].icon=r.domElement.toDataURL();sc.remove(w);
  }
  pm.dispose();env.dispose();r.dispose();try{r.forceContextLoss();}catch(e){}
}

function setAge(p,age){
  const t=clamp(age,0,1);
  const col=new THREE.Color(0x1a1a1a).lerp(new THREE.Color(0xf0f0ee),t);
  p.hairParts.forEach(h=>{h.material=mat(col.getHex());});
  if(p.brows)p.brows.forEach(b=>{b.material=mat(new THREE.Color(0x2a2a2a).lerp(new THREE.Color(0xeeeeea),t).getHex());});
  if(p.lines)p.lines.forEach((l,i)=>{l.visible=t>[0.45,0.7][i];});
  p.stoop=t*0.42;p.speed=1-t*0.22;
}
function animPerson(p,dt,t){
  const walk=p.walk;p.phase+=dt*(8.5*p.speed)*(walk>0.02?1:0);
  const s=Math.sin(p.phase);const b=p.body;
  p.legL.rotation.x=s*0.7*walk;p.legR.rotation.x=-s*0.7*walk;
  p.armL.rotation.x=-s*0.6*walk;p.armR.rotation.x=s*0.6*walk;
  b.position.y=Math.abs(s)*0.04*walk-p.crouch*0.28;
  b.rotation.x=p.stoop+p.crouch*0.6+walk*0.05+p.lean;
  p.headG.rotation.x=-p.stoop*0.6+(walk>0.02?Math.sin(p.phase*2)*0.03:0)+p.crouch*0.2;
  if(p.crouch>0){p.legL.rotation.x=-1.1*p.crouch;p.legR.rotation.x=-1.1*p.crouch;b.position.y=-0.3*p.crouch;}
}
function randomPerson(era,opts={}){
  const top=pick(ERA_TOPS[era]),bottom=pick(ERA_BOTTOMS[era]);

  let hat=null,hatColor=null,hairStyle=rnd()<0.3?'bun':'cap';
  if(era===2&&rnd()<0.5){hat='cone';hatColor=pick([0x3a2a1e,0x5a3a3a,0x2a3a5a]);}
  if(era===3&&rnd()<0.6){hat='flat';hatColor=pick([0x3a3a3a,0x4a3a2a]);}
  if(era===5&&rnd()<0.5){hat=rnd()<0.5?'band':'visor';hatColor=pick([0x5ad0ff,0xff6bd6,0x9bff6b]);}
  if(era===5&&rnd()<0.3)hairStyle='none';
  const p=makePerson(Object.assign({skin:pick(SKINS),hair:hairC,hairStyle,top,bottom,hat,hatColor,scale:0.92+rnd()*0.14},opts));

}
function makeSpecies(kind){

  const o={root,body,kind,phase:Math.random()*6,walk:1,speed:1,crouch:0,stoop:0,headG:new THREE.Group(),armL:new THREE.Group(),armR:new THREE.Group(),legL:new THREE.Group(),legR:new THREE.Group(),hairParts:[],species:true};
  if(kind==='tall'){
    const t=cyl(0.1,0.14,1.1,0xb9c4cc,{},12);t.position.y=0.8;body.add(t);
    const h=sph(0.3,0xc9d3da,{},16,12);h.position.y=1.55;h.scale.set(1,1.25,1);body.add(h);
    [-1,1].forEach(k=>{const e=sph(0.09,0x111118,{roughness:0.2},10,8);e.scale.set(1,1.5,0.6);e.position.set(k*0.13,1.6,0.26);body.add(e);});
    [o.legL,o.legR].forEach((l,i)=>{const m=cyl(0.045,0.05,0.28,0xa8b4bc,{},6);m.position.y=-0.14;l.add(m);l.position.set(i?0.08:-0.08,0.28,0);body.add(l);});
    [o.armL,o.armR].forEach((a,i)=>{const m=cyl(0.035,0.04,0.6,0xb9c4cc,{},6);m.position.y=-0.3;a.add(m);a.position.set(i?0.16:-0.16,1.25,0);body.add(a);});
  }else if(kind==='blob'){
    const b=sph(0.42,0x8ee07a,{roughness:0.3},18,14);b.position.y=0.42;body.add(b);o.blob=b;
    [[-0.15,0.5],[0.12,0.56],[0.0,0.36]].forEach(([x,y])=>{const w=sph(0.09,0xffffff,{},8,6);w.position.set(x,y,0.36);body.add(w);const p=sph(0.045,0x1a1a1a,{},6,5);p.position.set(x,y,0.43);body.add(p);});
  }else if(kind==='orb'){
    const b=sph(0.3,0xffd27a,{emissive:0x8a5a10,emissiveIntensity:0.5},18,14);b.position.y=1.2;body.add(b);o.blob=b;
    const r=new THREE.Mesh(new THREE.TorusGeometry(0.45,0.03,6,24),mat(0xffffff,{emissive:0xffffff,emissiveIntensity:0.4}));r.rotation.x=Math.PI/2.4;r.position.y=1.2;body.add(r);o.ring=r;
    const e=sph(0.07,0x1a1a1a,{},8,6);e.position.set(0,1.25,0.28);body.add(e);
  }
  return o;
}
function animSpecies(o,dt,t){
  if(o.kind==='tall'){o.phase+=dt*5;const s=Math.sin(o.phase);o.legL.rotation.x=s*0.5;o.legR.rotation.x=-s*0.5;o.armL.rotation.x=-s*0.3;o.armR.rotation.x=s*0.3;o.body.position.y=Math.abs(s)*0.03;}
  else if(o.kind==='blob'){o.phase+=dt*6;const s=Math.max(0,Math.sin(o.phase));o.body.position.y=s*0.35;o.blob.scale.set(1+(1-s)*0.15,1-(1-s)*0.15,1+(1-s)*0.15);}
  else if(o.kind==='orb'){o.body.position.y=Math.sin(t*2.2+o.phase)*0.15;o.ring.rotation.z+=dt*1.5;}
}

    [[0.66,0.46],[0.66,-0.46],[-0.66,0.46],[-0.66,-0.46]].forEach(([x,z])=>{const w=wheel(0.26,0.2);w.position.set(x,0.26,z);root.add(w);o.wheels.push(w);});
    const hl=box(0.05,0.1,0.22,0xffffff,{emissive:0xffffff,emissiveIntensity:0.8});hl.position.set(1.0,0.55,0.3);root.add(hl);const hl2=hl.clone();hl2.position.z=-0.3;root.add(hl2);

    const win=new THREE.Mesh(new THREE.SphereGeometry(0.42,16,10,0,Math.PI*2,0,Math.PI/2),mat(0x6ac8f0,{roughness:0.05,env:1}));win.scale.set(1.3,0.8,0.9);win.position.set(0.2,0.75,0);root.add(win);

function skyMat(top,hor,bot){
  return new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
    uniforms:{top:{value:new THREE.Color(top)},hor:{value:new THREE.Color(hor)},bot:{value:new THREE.Color(bot)}},
    vertexShader:`varying vec3 vP;void main(){vP=normalize(position);vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.0);gl_Position=p.xyww;}`,
    fragmentShader:`uniform vec3 top;uniform vec3 hor;uniform vec3 bot;varying vec3 vP;void main(){float h=vP.y;vec3 c=h>0.0?mix(hor,top,pow(smoothstep(0.0,0.75,h),0.8)):mix(hor,bot,smoothstep(0.0,0.2,-h));gl_FragColor=vec4(c,1.0);
      #include <colorspace_fragment>
    }`});
}

    }

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle='#a9b8c6';ctx.fillRect(0,0,w,gY);
    ctx.fillStyle='#6b4a2b';ctx.fillRect(0,gY,w,h-gY);
    const X=x=>w/2+(x-pit.x)*s;
    if(kA>0.02){ctx.globalAlpha=Math.min(1,kA*1.5);
      Surface.buildings.forEach(b=>{const bx=X(b.x-b.w/2),bw=b.w*s;ctx.fillStyle='#e4e8ee';ctx.fillRect(bx,gY-b.h*s,bw,b.h*s);ctx.strokeStyle='#9aa3ad';ctx.lineWidth=1;ctx.strokeRect(bx,gY-b.h*s,bw,b.h*s);});
      ctx.fillStyle='#b08a5a';ctx.fillRect(X(-2.2),gY-1.35*s,4.4*s,1.35*s);ctx.fillStyle='#d9b45a';ctx.beginPath();ctx.moveTo(X(-3.15),gY-1.35*s);ctx.lineTo(X(0),gY-4.3*s);ctx.lineTo(X(3.15),gY-1.35*s);ctx.closePath();ctx.fill();
      const mx=X(pit.x-0.62);const ps=Math.max(0.6,s);
      ctx.fillStyle='#9a6a3e';ctx.fillRect(mx-0.22*ps,gY-0.75*ps,0.44*ps,0.75*ps);ctx.fillStyle='#f4c9a4';ctx.beginPath();ctx.arc(mx+0.15*ps,gY-0.95*ps,0.33*ps,0,7);ctx.fill();
      ctx.globalAlpha=1;}
    ctx.fillStyle='#6fb84a';ctx.fillRect(0,gY-Math.max(2,0.06*s),w,Math.max(2,0.06*s));
    const fillK=smoothstep(0.6,5.0,T);
    for(let j=TNY-1;j>=0;j--){const y=TG.y0+j*VS;if(y>0)continue;if(y<-deep-1)break;const py=gY+(-y)*hy;
      for(let i=0;i<TNX;i++){if(AIRCNT[i+TNX*j]>0){const x=TG.x0+i*VS;ctx.fillStyle=fillK>0.5?'rgba(110,160,210,0.92)':'rgba(30,18,8,0.85)';ctx.fillRect(w/2+x*hx,py,Math.max(0.6,VS*hx+0.4),Math.max(0.4,VS*hy+0.4));}}}
  },
  // ----- loop -----
  tick(dt){
    G.t+=dt;const t=G.t;
    Input.update(dt);
    if(UI.inspOpen)UI.inspRender(dt);
    const st=G.state;
    if(this.tr)this.updateTransition(dt,t);
    else if(st==='surface')this.updateSurface(dt,t);
    else if(st==='hut'||st==='craft')this.updateHut(dt,t);
    else if(st==='inner')this.updateInner(dt,t);
    else if(st==='finalEnd')this.updateFinal(dt,t);
    else if(st==='hutPan')this.updateHutPan(dt,t);
    else if(st==='leaveEnd')this.updateLeave(dt,t);
    else if(st==='title'){P.yaw+=Math.sin(t*0.2)*0.0004;this.camFollow(dt);Surface.playerPos.copy(P.pos);Surface.update(dt,t);}
    else if(st==='toHut'||st==='toSurface'){if(this.sceneKey==='surface')Surface.update(dt,t);else Hut.update(dt,t);}
    else if(st==='end'){}
    if(!Number.isFinite(View.walk))View.walk=0;
    if(G.state!=='inner')Terrain.hitU.uHitOn.value=0;
    View.update(dt,t);
    // view lighting
    if(this.sceneKey==='inner'){const dk=Inner.depthK(P.pos.y);VIEW.hemi.color.set(0xfff0dc);VIEW.hemi.intensity=lerp(1.15,0.62,dk);VIEW.sun.color.set(0xffd8a8);VIEW.sun.intensity=lerp(1.25,0.75,dk);}
    else if(this.sceneKey==='hut'){VIEW.hemi.color.set(0xffd8b0);VIEW.hemi.intensity=0.95;VIEW.sun.color.set(0xffb070);VIEW.sun.intensity=1.0;}
    else{VIEW.hemi.color.set(0xfff6ea);VIEW.hemi.intensity=Surface.rain?0.85:1.12;VIEW.sun.color.set(0xfff2dd);VIEW.sun.intensity=Surface.rain?0.8:1.3;}
    if(this.sceneKey==='surface'){SURF.sun.position.set(P.pos.x+12,24,P.pos.z+9);SURF.sun.target.position.set(P.pos.x,0,P.pos.z);SURF.sun.target.updateMatrixWorld();}
  },
  render(){
    const mm=$('mm');if(mm.classList.contains('show')){const cv=$('mmc');const r=mm.getBoundingClientRect();const W=Math.round(r.width*2),H=Math.round(r.height*2);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
      const ctx=cv.getContext('2d');ctx.setTransform(2,0,0,2,0,0);if(G.state==='finalEnd')this.drawFinalMinimap(ctx,r.width,r.height);else Inner.drawMinimap(ctx,r.width,r.height,P);}
    renderer.clear();
    const sc=this.sceneKey==='inner'?INNER.scene:this.sceneKey==='hut'?HUT.scene:SURF.scene;
    renderer.render(sc,camera);
    if(View.visible&&['surface','hut','inner','dive','slide','climb','emerge','craft','toHut','toSurface'].includes(G.state)){renderer.clearDepth();renderer.render(VIEW.scene,viewCam);}
  },
  loop(){
    let last=performance.now();const manual=location.search.includes('manual');
    const frame=now=>{requestAnimationFrame(frame);const dt=manual?0:clamp((now-last)/1000,0,0.05);last=now;if(dt>0)this.tick(dt);this.render();};
    requestAnimationFrame(frame);
  },
};
window.View=View;window.__chimjam={G,Game,Inner,Surface,Hut,Terrain,View,UI,AU,P,Input,ITEMS,camera,renderer,step:(dt,n)=>{for(let i=0;i<n;i++)Game.tick(dt);}};
Game.init();

</script>
